plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '11'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.10'
}

android {
    namespace "com.vaya.partner_app"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.vaya.partner_app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: keystoreProperties.getProperty('GOOGLE_MAPS_API_KEY') ?: localProperties.getProperty('GOOGLE_MAPS_API_KEY') ?: 'YOUR_MAPS_API_KEY_HERE'
        ]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias'] ?: 'upload'
            keyPassword = keystoreProperties['keyPassword'] ?: ''
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword'] ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation platform('com.google.firebase:firebase-bom:33.14.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
}

project.getTasks().withType(com.android.build.gradle.internal.tasks.CheckAarMetadataTask.class).configureEach {
    enabled = false
}

tasks.register("copyApkToLegacyPath") {
    doLast {
        def srcFile = file("${rootProject.buildDir}/app/outputs/flutter-apk/app-release.apk")
        def destDir = file("${projectDir}/build/outputs/apk/release")
        if (srcFile.exists()) {
            mkdir destDir
            copy {
                from srcFile
                into destDir
            }
            println "Copied APK to legacy path: ${destDir}/app-release.apk"
        }
    }
}

project.afterEvaluate {
    tasks.matching { it.name == "assembleRelease" }.all {
        finalizedBy(copyApkToLegacyPath)
    }
}


